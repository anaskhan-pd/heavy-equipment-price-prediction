<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141721" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c0e14" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Flow connecting lines -->
  <path d="M 210 240 L 250 240" stroke="#313848" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 450 240 L 490 240" stroke="#313848" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 690 240 L 730 240" stroke="#313848" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 910 240 L 950 240" stroke="#38bdf8" stroke-width="2"/>

  <!-- Stage 1: Ingestion & Raw Features -->
  <g transform="translate(30, 140)">
    <rect width="180" height="200" rx="12" fill="url(#cardGrad)" stroke="#232936" stroke-width="1.2"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#1e2330" stroke="#374151" stroke-width="1"/>
    <text x="32" y="37" fill="#6366f1" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">01</text>
    <text x="16" y="72" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600">Raw Ingestion</text>
    <text x="16" y="92" fill="#9ca3af" font-family="monospace" font-size="11">138,701 records</text>
    <line x1="16" y1="108" x2="164" y2="108" stroke="#1f2430" stroke-width="1"/>
    <text x="16" y="130" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• 50 raw attributes</text>
    <text x="16" y="152" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• Auction sale history</text>
    <text x="16" y="174" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• High missingness</text>
  </g>

  <!-- Stage 2: Domain Feature Engineering -->
  <g transform="translate(250, 110)">
    <rect width="200" height="260" rx="12" fill="url(#cardGrad)" stroke="#232936" stroke-width="1.2"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#1e2330" stroke="#374151" stroke-width="1"/>
    <text x="32" y="37" fill="#818cf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">02</text>
    <text x="16" y="72" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600">Domain Engineering</text>
    <text x="16" y="92" fill="#38bdf8" font-family="monospace" font-size="11">50 → 108 Features</text>
    <line x1="16" y1="108" x2="184" y2="108" stroke="#1f2430" stroke-width="1"/>
    <text x="16" y="130" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• Regex Spec Parsers</text>
    <text x="24" y="148" fill="#6b7280" font-family="monospace" font-size="10">(stick, tire, hp, ton)</text>
    <text x="16" y="172" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• Temporal & Cyclical</text>
    <text x="24" y="190" fill="#6b7280" font-family="monospace" font-size="10">(sin/cos, boom index)</text>
    <text x="16" y="214" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• Age & Wear Curves</text>
    <text x="16" y="236" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• Multi-way Interactions</text>
  </g>

  <!-- Stage 3: Leak-Free Preprocessing & Encodings -->
  <g transform="translate(490, 100)">
    <rect width="200" height="280" rx="12" fill="url(#cardGrad)" stroke="#232936" stroke-width="1.2"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#1e2330" stroke="#374151" stroke-width="1"/>
    <text x="32" y="37" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">03</text>
    <text x="16" y="72" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600">Leak-Free Pipeline</text>
    <text x="16" y="92" fill="#38bdf8" font-family="monospace" font-size="11">Expanded to 252 Dim</text>
    <line x1="16" y1="108" x2="184" y2="108" stroke="#1f2430" stroke-width="1"/>
    <text x="16" y="130" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• ColumnTransformer</text>
    <text x="16" y="152" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• 5-Fold OOF Target Enc</text>
    <text x="24" y="170" fill="#6b7280" font-family="monospace" font-size="10">(Bayesian smoothed)</text>
    <text x="16" y="194" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• Target Stat Encodings</text>
    <text x="16" y="216" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• Pairwise Encodings</text>
    <text x="16" y="238" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• OOF Group Aggs</text>
    <text x="16" y="260" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">• log1p Target Space</text>
  </g>

  <!-- Stage 4: 6 Diverse Base Learners -->
  <g transform="translate(730, 80)">
    <rect width="180" height="320" rx="12" fill="url(#cardGrad)" stroke="#232936" stroke-width="1.2"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#1e2330" stroke="#374151" stroke-width="1"/>
    <text x="32" y="37" fill="#a78bfa" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">04</text>
    <text x="16" y="72" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="600">6 Base Models</text>
    <text x="16" y="92" fill="#a78bfa" font-family="monospace" font-size="11">5-Fold CV Cross-Val</text>
    <line x1="16" y1="108" x2="164" y2="108" stroke="#1f2430" stroke-width="1"/>
    <text x="16" y="130" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">XGBoost (0.19907)</text>
    <text x="16" y="156" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">LightGBM 1 (0.19962)</text>
    <text x="16" y="182" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">LightGBM 2 (0.20088)</text>
    <text x="16" y="208" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">CatBoost 2 (0.20468)</text>
    <text x="16" y="234" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">CatBoost 1 (0.20583)</text>
    <text x="16" y="260" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Extra Trees (0.21366)</text>
    <line x1="16" y1="280" x2="164" y2="280" stroke="#1f2430" stroke-width="1"/>
    <text x="16" y="302" fill="#6b7280" font-family="monospace" font-size="10">Baseline: 0.67194</text>
  </g>

  <!-- Stage 5: Level-2 Stacking & Blend -->
  <g transform="translate(950, 130)">
    <rect width="130" height="220" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="32" y="37" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">05</text>
    <text x="16" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Stack & Blend</text>
    <text x="16" y="90" fill="#38bdf8" font-family="monospace" font-size="11">Ridge + Elastic</text>
    <line x1="16" y1="104" x2="114" y2="104" stroke="#1f2430" stroke-width="1"/>
    <text x="16" y="124" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">OOF: 0.19673</text>
    <text x="16" y="146" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">Kaggle RMSLE:</text>
    <text x="16" y="168" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="800">0.18335</text>
    <text x="16" y="194" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="10">Rank 135 / 2,593</text>
    <text x="16" y="208" fill="#34d399" font-family="monospace" font-size="10">Top 5.2%</text>
  </g>
</svg>
